name: CI

on:
  push:
    branches: ["**"]
    tags: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Publish module to the public Go proxy
        if: github.event_name == 'push'
        env:
          MODULE_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
        run: |
          module_path="$(go list -m)"
          GOPROXY=https://proxy.golang.org go mod download "${module_path}@${MODULE_VERSION}"
