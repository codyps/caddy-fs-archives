name: Release

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Bump version and push tag
        id: tag
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch
      - uses: actions/setup-go@v7
        if: steps.tag.outputs.new_tag != ''
        with:
          go-version-file: go.mod
      - name: Publish tagged module to the public Go proxy
        if: steps.tag.outputs.new_tag != ''
        env:
          MODULE_VERSION: ${{ steps.tag.outputs.new_tag }}
        run: |
          module_path="$(go list -m)"
          GOPROXY=https://proxy.golang.org go mod download "${module_path}@${MODULE_VERSION}"
